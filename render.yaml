services:
  - type: web
    name: monitorraspberry
    runtime: docker
    region: virginia
    plan: starter
    branch: main
    healthCheckPath: /healthz
    disk:
      name: telemetry
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_DB
        value: /var/data/server.sqlite3
      - key: READ_TOKEN
        generateValue: true
      - key: UPLOAD_TOKEN
        generateValue: true
