# O plano Free tem disco efêmero. O envio fica desativado até a configuração
# de um armazenamento persistente externo. Não configurar UPLOAD_TOKEN aqui.
services:
  - type: web
    name: monitorraspberry
    runtime: docker
    region: virginia
    plan: free
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: READ_TOKEN
        generateValue: true
